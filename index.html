<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三维数学曲面</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="toolbar">
        <div class="title-row">
          <div>
            <h1>三维数学曲面</h1>
            <p class="subtitle">输入函数生成三维图像 · 鼠标/触控旋转 · 滚轮/双指缩放</p>
          </div>
        </div>

        <div class="controls">
          <label class="field formula-field">
            <span>函数</span>
            <math-field
              id="formula-field"
              aria-label="函数"
              default-mode="math"
              letter-shape-style="tex"
              math-virtual-keyboard-policy="auto"
              smart-fence="on"
              smart-mode="on"
              smart-superscript="on"
              placeholder="例如：x^2+y^2 或 x^2+y^2+z^2=9"
            >\sin\left(\sqrt{x^2+y^2}\right)</math-field>
          </label>

          <label class="field">
            <span>范围 R</span>
            <input id="range-input" type="number" min="1" max="20" step="1" />
          </label>

          <div class="resolution">
            <span class="resolution-label">精度</span>
            <div class="resolution-buttons" role="group" aria-label="精度选择">
              <button type="button" data-resolution="20">低 20</button>
              <button type="button" data-resolution="28">中 28</button>
              <button type="button" data-resolution="36">高 36</button>
            </div>
          </div>

          <div class="action-buttons">
            <button id="generate-button" type="button">生成图像</button>
            <button id="reset-formula-button" type="button">恢复默认</button>
            <button id="reset-view-button" type="button">重置视角</button>
          </div>

          <div id="error-message" class="error" hidden></div>
        </div>
      </header>

      <main id="viewer" class="viewer" aria-label="三维曲面视图"></main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
